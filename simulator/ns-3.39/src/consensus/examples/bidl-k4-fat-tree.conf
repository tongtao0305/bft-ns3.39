# Classic k=4 Fat-Tree: 16 hosts, 8 edge, 8 aggregation, and 4 core switches.
preset=bidl-rdma
scenario=bidl-k4-fat-tree
topology=qbb-file
topologyFile=src/consensus/examples/k4-fat-tree-qbb-topology.txt
bidlIngressMode=direct
replicaCount=4
faultTolerance=1
ingressPhysicalId=1
ordererPhysicalIds=0,4,8,12
executorPhysicalIds=2,6,10,14
# Disabled by default; enable with --bidlAttackEnabled=true. Host 3 becomes logical malicious node 300.
bidlAttackEnabled=false
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=3
bidlAttackTargetExecutors=1
bidlAttackProbability=1.0
bidlAttackStartMs=0
bidlAttackStopMs=0
bidlAttackProcessingUs=20
requestSize=1024
transactionsPerRequest=1
requestRate=10000
batchSize=500
batchTimeoutMs=100
sequencerServiceUs=20
transactionVerificationUs=10
executionTimePerTransactionUs=15
pbftMessageProcessingUs=5
approvalTimePerBlockUs=100
storageTimePerBlockUs=500
consensusSoftwareTimePerBlockUs=10000
commitProcessingTimePerBlockUs=2500
simulationTime=3
