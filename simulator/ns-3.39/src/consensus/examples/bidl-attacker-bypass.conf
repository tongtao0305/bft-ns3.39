# Controlled asymmetric-path experiment.
# Sequencer 8 -> executors 4-7 uses the 10-11 bottleneck.
# Sequencer 8 -> malicious 9 -> executors uses the uncongested 10-12-14-13 bypass.
preset=bidl-rdma
scenario=bidl-attacker-bypass
topology=qbb-file
topologyFile=src/consensus/examples/bidl-attacker-bypass-qbb-topology.txt
flowFile=src/consensus/examples/bidl-attacker-bypass-background-flow.txt
bidlIngressMode=direct
replicaCount=4
faultTolerance=1
ingressPhysicalId=8
ordererPhysicalIds=0,1,2,3
executorPhysicalIds=4,5,6,7
bidlAttackEnabled=true
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=9
bidlAttackTargetExecutors=0
bidlAttackProbability=1.0
bidlAttackStartMs=0
bidlAttackStopMs=0
# Deliberately slower than the empty-path race: without the background flow this produces no reexecution.
bidlAttackProcessingUs=150
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=3
rdmaMtu=9000
rdmaL2ChunkSize=9000
requestCount=5000
requestSize=1024
transactionsPerRequest=1
requestRate=5000
batchSize=500
batchTimeoutMs=100
simulationTime=6
measurementTime=4
