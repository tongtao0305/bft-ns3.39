# BIDL/RDMA experiment on the 8-leaf, 8-spine, 128-host topology.
# Per-load flowFile and outputPrefix are supplied by run-bidl-8x8-hadoop.sh.
preset=bidl-rdma
scenario=bidl-8x8-hadoop
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-8x8x128-21os.txt
bidlIngressMode=network
workload=open-loop
replicaCount=4
faultTolerance=1
ordererPhysicalIds=0,16,32,48
executorPhysicalIds=1,17,33,49
ingressPhysicalId=8
clientPhysicalId=9
bidlAttackEnabled=true
bidlMaliciousNodeCount=1
# Host 10 shares leaf switch 128 with sequencer host 8.
bidlMaliciousPhysicalIds=10
bidlAttackTargetExecutors=1
bidlAttackProbability=1.0
bidlAttackStartMs=0
bidlAttackStopMs=0
bidlAttackProcessingUs=20
requestSize=1024
transactionsPerRequest=1
requestRate=30000
requestCount=30000
batchSize=500
batchTimeoutMs=100
sequencerServiceUs=20
transactionVerificationUs=10
executionTimePerTransactionUs=15
pbftMessageProcessingUs=5
approvalTimePerBlockUs=100
storageTimePerBlockUs=500
consensusSoftwareTimePerBlockUs=10000
commitProcessingTimePerBlockUs=2500
# 1 s offered-load interval after applications start, followed by a 2 s drain.
applicationStartTime=1
warmupTime=0
measurementTime=3
cooldownTime=0
simulationTime=4
