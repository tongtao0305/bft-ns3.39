# The preset is applied first, values below override it, and CLI overrides both.
preset=pbft-rdma
scenario=pbft-rdma-incast
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-8x8x128-21os.txt
workload=open-loop
clientCount=1
requestCount=20
requestSize=1024
requestRate=2000
simulationTime=2
leafCount=2
spineCount=2
rdmaIncastSenders=4
rdmaIncastBursts=2
rdmaIncastFlowBytes=262144
outputPrefix=consensus-config-run
