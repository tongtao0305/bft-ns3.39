# Zyzzyva baseline: 128 hosts, 10 consensus replicas, one network client.
# Attack and IORS marking enabled; background traffic disabled. Run from simulator/ns-3.39.
preset=zyzzyva-rdma
scenario=zyzzyva-128host-attack-iors
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-4x8x128-41os.txt

# Match the BIDL orderer host placement; the first replica is the initial primary.
replicaCount=10
faultTolerance=3
replicaPhysicalIds=0,16,32,48,64,80,96,112,2,18
ingressPhysicalId=0
clientCount=1
clientPhysicalId=9
clientPhysicalIds=9

# 50,000 requests/transactions submitted during [0,5) seconds; drain until 20s.
workload=open-loop
requestSize=1024
transactionsPerRequest=1
requestRate=10000
requestCount=50000
applicationStartTime=0
warmupTime=0
measurementTime=5
cooldownTime=15
simulationTime=20
requestTimeoutMs=1000
retransmissionTimeoutMs=100
viewChangeTimeoutMs=1000

# Corrected recovery rule; keep these protocol/service parameters fixed.
zyzzyvaRecoveryRule=1
zyzzyvaViewChangeEnabled=true
resourceCpuCores=1
resourceStorageChannels=1
transactionVerificationUs=10
executionTimePerTransactionUs=15

# Same network settings as the BIDL baseline.
rdmaCcMode=1
enableEcn=true
qbbQcnEnabled=true
qbbPfcEnabled=true
rdmaMtu=1400
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=3
switchBufferBytes=25165824
ecnKminBytes=102400
ecnKmaxBytes=409600
ecnPmax=0.2

# No trace: flowFile is intentionally omitted (its preset default is empty).
backgroundFlows=0
rdmaLongFlows=0
rdmaShortFlows=0
rdmaIncastSenders=0
rdmaConstantRateGbps=0

# Malicious logical replica 0 is the initial primary at physical host 0.
# Conflicting ORDER-REQ goes to logical replica 1 at physical host 16.
zyzzyvaEquivocationEnabled=true
zyzzyvaMaliciousReplicaIds=0
# Inject once in view 0, on the first eligible request at or after 2.0s.
# Format: view,primary logical ID,absolute trigger seconds,target logical ID.
zyzzyvaEquivocationPlan=0,0,2.0,1
zyzzyvaEquivocationStartSequence=1
zyzzyvaEquivocationTarget=1
zyzzyvaEquivocationDelayUs=20
bidlAttackEnabled=false
bidlDenylistEnabled=false
messageDropProbability=0
messageDelayUs=0
failedNodeId=4294967295
iorsMode=1
iorsDetectOnly=false
# Marked ORDER-REQ triggers peer evidence collection and verification before accusation.
# View change retains the normal quorum rules; speculative execution is not gated.
iorsTerminalGate=false
diagnosticEvents=false
seed=1
run=1
outputPrefix=results/zyzzyva-128host-attack-iors
