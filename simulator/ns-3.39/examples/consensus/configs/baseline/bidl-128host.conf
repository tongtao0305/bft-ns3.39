# 128 hosts, BIDL/RDMA, DCQCN, Hadoop 5 Gbit/s per host, sequence tampering + IORS.
# Run from simulator/ns-3.39; one request contains one transaction.
preset=bidl-rdma
scenario=bidl-128host
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-4x8x128-41os.txt

# replicaCount=10 creates TEN orderers AND TEN executors (f=3).
# Hosts 0..127; leaf switches 128..135; spine switches 136..139.
# Each leaf connects its consecutive group of 16 hosts.
replicaCount=10
faultTolerance=3
ordererPhysicalIds=0,16,32,48,64,80,96,112,2,18
executorPhysicalIds=1,17,33,49,65,81,97,113,3,19
# Dedicated sequencer on host 8; native=true would instead sequence at the PBFT leader.
bidlNativeSequencing=false
bidlIngressMode=network
ingressPhysicalId=8
clientCount=1
clientPhysicalId=9
clientPhysicalIds=9

# One client sends 50,000 requests at 10,000 requests/s over [0,5) seconds.
workload=open-loop
requestSize=1024
transactionsPerRequest=1
requestRate=10000
requestCount=50000
applicationStartTime=0
warmupTime=0
measurementTime=5
cooldownTime=15
simulationTime=20
# Larger blocks avoid turning the per-block software service into a bottleneck.
batchSize=500
batchTimeoutMs=50
bidlCompactOrderNotifications=true
requestTimeoutMs=1000
retransmissionTimeoutMs=100
viewChangeTimeoutMs=1000

# Keep the CPU/storage service profile explicit for reproducible comparisons.
resourceCpuCores=1
resourceStorageChannels=1
sequencerServiceUs=20
transactionVerificationUs=10
executionTimePerTransactionUs=15
pbftMessageProcessingUs=5
approvalTimePerBlockUs=100
storageTimePerBlockUs=500
consensusSoftwareTimePerBlockUs=10000
commitProcessingTimePerBlockUs=2500

# DCQCN with ECN and lossless PFC; MTU accommodates an unfragmented transaction.
rdmaCcMode=1
enableEcn=true
qbbQcnEnabled=true
qbbPfcEnabled=true
rdmaMtu=1400
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=3
switchBufferBytes=25165824
ecnKminBytes=102400
ecnKmaxBytes=409600
ecnPmax=0.2

# Canonical Hadoop trace, repaired in place at its original source path.
# 630,891 flows, 80,000,000,000 bytes; absolute timestamps in [2,3] seconds.
# PG=3 shares the consensus queue; every app_id is 0 (background, not client traffic).
flowFile=examples/consensus/workloads/hadoop/bg-hadoop-128host-5G-2t3.txt
# Do not inject a second, synthetic background workload.
backgroundFlows=0
rdmaLongFlows=0
rdmaShortFlows=0
rdmaIncastSenders=0
rdmaConstantRateGbps=0

# Host 10 receives sequencer broadcasts, then forges sequence s -> s+1.
# Client content/authentication is preserved. Forge to all ten executors.
# Attack stays enabled throughout the simulation, including any delayed requests.
bidlAttackEnabled=true
bidlAttackMode=1
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=10
bidlAttackTargetExecutors=0
bidlAttackProbability=1.0
bidlAttackProcessingUs=20
bidlAttackStartMs=0
bidlAttackStopMs=0
# Isolate IORS from the independent denylist mechanism.
bidlDenylistEnabled=false

# Switches mark conflicts without holding packets (mode=1).
# Executors defer marked candidates for 1 ms, accept unmarked replacements,
# and fall back to normal verification/execution on timeout (not permanent rejection).
iorsMode=1
iorsDetectOnly=false
iorsTerminalGate=true
iorsGateTimeoutUs=1000
iorsCapacity=4096
iorsTtlUs=10000
iorsFingerprintBits=64

# Check run-summary.csv after the run: completed_requests=50000 AND
# background_completed_flows=630891. A 20s stop time alone guarantees neither.
diagnosticEvents=false
seed=1
run=1
outputPrefix=results/bidl-128host
