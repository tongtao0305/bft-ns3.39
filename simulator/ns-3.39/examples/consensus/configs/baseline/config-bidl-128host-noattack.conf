# BIDL baseline: 128 hosts, 10 orderers + 10 executors, one network client.
# No attack, IORS or background traffic. Run from simulator/ns-3.39.
preset=bidl-rdma
scenario=bidl-128host-noattack
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-4x8x128-41os.txt

# Physical host IDs; distribute replicas across the eight 16-host leaves.
replicaCount=10
faultTolerance=3
ordererPhysicalIds=0,16,32,48,64,80,96,112,2,18
executorPhysicalIds=1,17,33,49,65,81,97,113,3,19
# Dedicated sequencer host 8; client host 9 sends requests to this sequencer.
bidlNativeSequencing=false
bidlIngressMode=network
ingressPhysicalId=8
clientCount=1
clientPhysicalId=9
clientPhysicalIds=9

# 50,000 requests/transactions submitted during [0,5) seconds; drain until 20s.
workload=open-loop
requestSize=1024
transactionsPerRequest=1
requestRate=10000
requestCount=50000
applicationStartTime=0
warmupTime=0
measurementTime=5
cooldownTime=15
simulationTime=20
requestTimeoutMs=1000
retransmissionTimeoutMs=100
viewChangeTimeoutMs=1000

# Protocol and service parameters stay fixed across network/attack matrix arms.
batchSize=500
batchTimeoutMs=50
bidlCompactOrderNotifications=true
resourceCpuCores=1
resourceStorageChannels=1
sequencerServiceUs=20
transactionVerificationUs=10
executionTimePerTransactionUs=15
pbftMessageProcessingUs=5
approvalTimePerBlockUs=100
storageTimePerBlockUs=500
consensusSoftwareTimePerBlockUs=10000
commitProcessingTimePerBlockUs=2500

# Shared network baseline: DCQCN, ECN and PFC; change CC in the experiment matrix.
rdmaCcMode=1
enableEcn=true
qbbQcnEnabled=true
qbbPfcEnabled=true
rdmaMtu=1400
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=3
switchBufferBytes=25165824
ecnKminBytes=102400
ecnKmaxBytes=409600
ecnPmax=0.2

# No trace: flowFile is intentionally omitted (its preset default is empty).
backgroundFlows=0
rdmaLongFlows=0
rdmaShortFlows=0
rdmaIncastSenders=0
rdmaConstantRateGbps=0

bidlAttackEnabled=false
# Reserve host 10 for the attacker, on leaf 128 with sequencer host 8.
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=10
zyzzyvaEquivocationEnabled=false
bidlDenylistEnabled=false
messageDropProbability=0
messageDelayUs=0
failedNodeId=4294967295
iorsMode=0
iorsDetectOnly=false
iorsTerminalGate=false
diagnosticEvents=false
seed=1
run=1
outputPrefix=results/bidl-128host-noattack
