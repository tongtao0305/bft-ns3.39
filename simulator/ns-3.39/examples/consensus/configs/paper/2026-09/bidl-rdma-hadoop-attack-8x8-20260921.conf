# Independent BIDL/RDMA Hadoop background-flow experiment, 2026-09-21.
# The launcher supplies the per-load flowFile and outputPrefix.
preset=bidl-rdma
scenario=bidl-rdma-hadoop-attack-8x8-20260921
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-8x8x128-21os.txt
bidlIngressMode=network
workload=open-loop
replicaCount=4
faultTolerance=1
ordererPhysicalIds=0,16,32,48
executorPhysicalIds=1,17,33,49
ingressPhysicalId=8
clientPhysicalId=9
bidlAttackEnabled=true
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=10
# Zero means target every executor.
bidlAttackTargetExecutors=0
bidlAttackProbability=1.0
bidlAttackStartMs=0
bidlAttackStopMs=0
bidlAttackProcessingUs=20
requestRate=30000
requestCount=30000
requestSize=1024
transactionsPerRequest=1
batchSize=500
batchTimeoutMs=30
# The full three seconds are both simulated and measured, starting at t=0.
applicationStartTime=0
warmupTime=0
measurementTime=3
cooldownTime=0
simulationTime=3
rdmaCcMode=0
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=4
rdmaMtu=1000
rdmaL2ChunkSize=4000
