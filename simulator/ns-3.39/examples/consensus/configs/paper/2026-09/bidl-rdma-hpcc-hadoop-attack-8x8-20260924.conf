# Independent BIDL/RDMA HPCC Hadoop background-flow experiment, 2026-09-24.
# The launcher supplies flowFile and outputPrefix for each workload.
preset=bidl-rdma
scenario=bidl-rdma-hpcc-hadoop-attack-8x8-20260924
topology=qbb-file
topologyFile=examples/consensus/topologies/topology-leaf-spine-8x8x128-21os.txt
bidlIngressMode=network
workload=open-loop
replicaCount=4
faultTolerance=1
ordererPhysicalIds=0,16,32,48
executorPhysicalIds=1,17,33,49
ingressPhysicalId=8
clientPhysicalId=9
bidlAttackEnabled=true
bidlMaliciousNodeCount=1
bidlMaliciousPhysicalIds=10
# Zero means target every BIDL executor.
bidlAttackTargetExecutors=0
bidlAttackProbability=1.0
bidlAttackStartMs=0
bidlAttackStopMs=0
bidlAttackProcessingUs=20
requestRate=30000
requestCount=30000
requestSize=1024
transactionsPerRequest=1
batchSize=500
batchTimeoutMs=30
applicationStartTime=0
warmupTime=0
measurementTime=5
cooldownTime=0
simulationTime=5
# ns3-datacenter mode 3 is HPCC (INT feedback).
rdmaCcMode=3
rdmaPriorityGroup=3
rdmaBackgroundPriorityGroup=3
rdmaMtu=1000
rdmaL2ChunkSize=4000
